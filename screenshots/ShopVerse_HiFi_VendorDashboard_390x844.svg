<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <!-- Background Canvas -->
  <rect width="390" height="844" rx="40" fill="#F7F4EF"/>
  
  <!-- Status Bar -->
  <rect x="0" y="0" width="390" height="44" fill="#F7F4EF"/>
  <text x="32" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#222820">9:41</text>
  <circle cx="340" cy="26" r="4" fill="#222820"/>
  <rect x="350" y="21" width="18" height="10" rx="3" stroke="#222820" stroke-width="1.5"/>

  <!-- Vendor Header / Store Profile -->
