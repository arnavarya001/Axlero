  <text x="36" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#222820">$3,420</text>
  <text x="36" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#2E7D32">↑ 18.4% vs last mo</text>

  <!-- Card 2: Active Orders -->
  <rect x="204" y="164" width="162" height="96" rx="12" fill="#FFFFFF" stroke="#E5E0D8"/>
  <text x="216" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#686E64">PENDING ORDERS</text>
  <text x="216" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#A64028">18</text>
  <text x="216" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#686E64">4 dispatch today</text>

  <!-- Card 3: Rating -->
  <rect x="24" y="272" width="162" height="80" rx="12" fill="#FFFFFF" stroke="#E5E0D8"/>
  <text x="36" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#686E64">STORE RATING</text>
  <text x="36" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#222820">4.9 ★</text>
  <text x="82" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#686E64">(128 reviews)</text>

  <!-- Card 4: Low Stock Alert -->
