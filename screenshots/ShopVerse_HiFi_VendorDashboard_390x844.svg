  <text x="24" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#222820">Recent Customer Orders</text>
  
  <!-- Order Item 1 -->
  <rect x="24" y="462" width="342" height="76" rx="12" fill="#FFFFFF" stroke="#E5E0D8"/>
  <text x="40" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#222820">#ORD-9842 · Priya S.</text>
  <rect x="278" y="474" width="72" height="20" rx="4" fill="#FFF3E0"/>
  <text x="290" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#E65100">● Pending</text>
  <text x="40" y="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#686E64">1x Handstitched Leather Journal · $48.50</text>
  <text x="40" y="528" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#686E64">Destination: Indiranagar, Bengaluru</text>

  <!-- Order Item 2 -->
  <rect x="24" y="548" width="342" height="76" rx="12" fill="#FFFFFF" stroke="#E5E0D8"/>
  <text x="40" y="574" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#222820">#ORD-9839 · Rohan M.</text>
  <rect x="278" y="560" width="72" height="20" rx="4" fill="#E8F5E9"/>
  <text x="294" y="574" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#2E7D32">✓ Packed</text>
  <text x="40" y="598" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#686E64">2x Slim Minimalist Cardholder · $64.00</text>
  <text x="40" y="614" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#686E64">Destination: Bandra West, Mumbai</text>

  <!-- Bottom Navigation Bar for Vendor Portal -->
  <rect x="0" y="764" width="390" height="80" fill="#FFFFFF" stroke="#E5E0D8"/>
  <text x="40" y="805" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#A64028">Overview</text>
  <circle cx="62" cy="815" r="2" fill="#A64028"/>
  <text x="125" y="805" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#686E64">Orders (18)</text>
  <text x="215" y="805" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#686E64">Products</text>
  <text x="310" y="805" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#686E64">Payouts</text>
</svg>