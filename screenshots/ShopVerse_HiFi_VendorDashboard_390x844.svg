  <text x="92" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#2E7D32">✓ Verified Artisan</text>
  <rect x="330" y="66" width="36" height="36" rx="18" fill="#FFFFFF" stroke="#E5E0D8"/>
  <circle cx="348" cy="84" r="6" stroke="#222820" stroke-width="1.5" fill="none"/>

  <!-- Page Title & Time Filter -->
